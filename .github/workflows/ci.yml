name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]*'
    tags:
      - 'v[0-9]*'
  pull_request:

concurrency: 
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      matrix:
        python:
          - version: "3.10"
            toxenv: py310
          - version: "3.11"
            toxenv: py311
          - version: "3.12"
            toxenv: py312
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose Python version ${{ matrix.python.version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python.version }}'
          cache: 'pip'
      - name: install tox
        run: python3 -m pip install tox tox-uv
      - name: run tox
        run: tox -e '${{ matrix.python.toxenv }}'
      # - name: submit code coverage
      #   uses: codecov/codecov-action@v4
      #   env:
      #     CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  mc-tests:
    if: false  # skip job for now, microscope-calibration is WIP
    strategy:
      matrix:
        python_version: ["3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Choose Python version ${{ matrix.python_version }}
        uses: actions/setup-python@v7
        with:
          python-version: '${{ matrix.python_version }}'
          cache: 'pip'
      - name: install uv
        run: python3 -m pip install uv
      - name: install core
        run: uv pip install --system .
      # TODO probably try to install just with HTTP?
      - uses: webfactory/ssh-agent@v0.9.1
        with:
            ssh-private-key: ${{ secrets.MC_DEPLOY_KEY }}
      - name: checkout mc
        run: git clone -b dev2 --single-branch git@github.com:uellue/Microscope-Calibration.git
      - name: install mc + test
        working-directory: ./Microscope-Calibration
        run: |
          uv pip install --system .
          uv pip install --system -r test_requirements.txt
          uv pip install --system ..
          uv pip install --system pytest
          pytest tests/
